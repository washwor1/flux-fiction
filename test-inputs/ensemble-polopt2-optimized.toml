version = 1

# Optimized arm of the three-lever Fluxion optimization A/B (2026-08-02).
# Paired with ensemble-polopt2-baseline.toml; identical in every field except
# the three levers below and the campaign name / job-name prefix.
#
# This arm has ALL THREE levers on the optimized side:
#   1. match-format          -> `jgf_shorthand` (via polopt-scheduler.json)
#   2. jobspec core resources -> OMITTED (omit_core_resources = true)
#   3. Fluxion traverser      -> `combined` for EVERY queue policy, i.e. both
#                                skip-empty-dfu-expansion and
#                                cancel-refresh-outedges
#
# Note on lever 3: the 2026-07-31 replicate rows in catalogue/RUNLOG.md record
# cancel-refresh as slower than skip-empty for easy and hybrid. Applying
# `combined` everywhere is the deliberate "all optimizations on" choice for this
# campaign, not an oversight -- a policy-aware split is the alternative if the
# easy/hybrid cells regress.

[campaign]
name = "polopt2-optimized"
output_root = "/p/lustre5/ashworth12/ff-polopt2-ab-20260802"
batch_size = 8
poll_interval_seconds = 60
walltime_minutes = 55
keep_generated_traces = false
no_faketime = false
broker_log_level = 3
no_broker_log_file = true
finalize_reserve_seconds = 300
flux_launch = true

[campaign.worker_env]
FLUX_FICTION_CONTAINER_IMAGE = "localhost/flux-fiction-dev-dft:latest"
FLUX_FICTION_CONTAINER_IMAGE_TAR = "/usr/WS1/ashworth12/ff-podman/flux-fiction-dev-dft.tar"
FLUX_FICTION_CONTAINER_INSTALLS = "/p/lustre5/ashworth12/polopt-container-installs-nodeonly-20260801"
FLUX_FICTION_NODEONLY_PREFIX = "/p/lustre5/ashworth12/flux-core-nodeonly.l5WGzh/prefix"
FLUX_FICTION_JOBTAP_SO = "/usr/WS1/ashworth12/ff-podman/flux-fiction-shared-clock/build/cp312/src/emu-jobtap.so"
FAKETIME_LIB = "/usr/WS1/ashworth12/ff-podman/libfaketime-shared-clock/src/libfaketimeMT.so.1"
FLUX_FICTION_FAKETIME_MODE = "shared"
NO_FAKE_STAT = "1"
DFTRACER_ENABLE = "1"
DFTRACER_TIME_METRIC = "NS"
DFTRACER_INC_METADATA = "1"
DFTRACER_DISABLE_IO = "1"
DFTRACER_FLUXION_FINALIZE_GENERATION = "0"

[input]
trace = "/g/g14/ashworth12/workspace/ff-podman/tuo_queueB_10k_sat.csv"
format = "tuolumne"
slice_start = 0
slice_count = 2000
cpus_per_node = 96

[shake]
duplicates = 10
attributes = ["interarrival", "runtime", "nodes"]
job_percentage = 5
degree_seconds = 60
relative_degree_percent = 5
max_nodes = 1144
seed = 91001

[rabbit]
ceiling_basis = "rabbit_node"
field_name = "RabbitGiB"
mean_fraction = 0.5
sigma_fraction = 0.16666666666666666
tail_alpha = 1.5
tail_min_gib = 100.0

[grid]
queue_policies = ["easy", "hybrid", "conservative"]
match_policies = ["firstnodex", "lonodex"]
rabbit_job_percentages = [0, 20]
rabbit_ceiling_percentages = [0, 20]
rabbit_distributions = ["pareto"]

[grid.fluxion_variants]
combined = "/p/lustre5/ashworth12/dftracer-gaussian-cancel-refresh-dftlocal-build-20260801_032143/installs-cancel-refresh-outedges-dftlocal/flux-sched"

# LEVER 3, optimized side: both traverser patches, for every queue policy.
[grid.policy_variants]
default = "combined"

[flux]
base_config = "/usr/WS1/ashworth12/ff-podman/flux-fiction-accuracy-tests/configs/tuo_pbatch.toml"
# LEVER 1, optimized side: "match-format": "jgf_shorthand".
base_config_json = "/usr/WS1/ashworth12/ff-podman/flux-fiction-shared-clock/test-inputs/polopt-scheduler.json"
resource_file = "/usr/WS1/ashworth12/ff-podman/resource_graphs/tuolumne.json"

[flux.config_overrides]
make_plots = false
nnodes = 1144
ncpus = 96
ngpus = 4
# LEVER 2, optimized side: cores are NOT emitted in the jobspec.
omit_core_resources = true
async_submit = true
submit_novalidate = true

[submission]
queues = ["pdebug"]
job_name_prefix = "ffe-p2o"
backend = "flux"

[submission.queue_limits.pdebug]
max_active = 8
